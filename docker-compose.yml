version: '3.8'

services:
  api:
    image: churn-prediction-api:v1
    container_name: churn-api
    ports:
      - '8000:8000'
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
